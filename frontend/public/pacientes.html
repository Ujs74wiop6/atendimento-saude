<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacientes - Atendimento Saúde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Atendimento Saúde</h1>
    <nav>
      <a href="pacientes.html" class="ativo">Pacientes</a>
      <a href="consultas.html">Consultas</a>
      <button class="sair" onclick="sair()">Sair</button>
    </nav>
  </header>

  <main>
    <p id="mensagem" class="mensagem"></p>

    <section class="cartao">
      <h2 id="titulo-form">Novo paciente</h2>
      <form id="form-paciente">
        <input type="hidden" id="id">
        <div class="campos">
          <label>Nome *
            <input type="text" id="nome" maxlength="100" required>
          </label>
          <label>CPF *
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
          </label>
          <label>Data de nascimento *
            <input type="date" id="data_nascimento" required>
          </label>
          <label>Telefone
            <input type="text" id="telefone" maxlength="20">
          </label>
        </div>
        <button type="submit">Salvar</button>
        <button type="button" id="cancelar" class="secundario">Cancelar</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Pacientes cadastrados</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Nascimento</th><th>Telefone</th><th>Ações</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="pacientes.js"></script>
</body>
</html>
